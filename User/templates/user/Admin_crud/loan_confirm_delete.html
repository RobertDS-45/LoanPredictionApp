{% extends 'user/base.html' %}

{% block title %}Confirm Delete - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm p-4 bg-white text-center">
            <h3 class="text-danger fw-bold mb-3">Are you sure?</h3>
            <p class="text-muted small mb-4">You are about to delete the loan request for <strong>{{ object.user.username }}</strong>. This action cannot be undone.</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-lg px-4 fw-bold">Yes, delete</button>
                <a href="{% url 'admin_loan_list' %}" class="btn btn-light btn-lg px-4 ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
