<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Thibitisha Kufuta - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm p-4 bg-white">
                <h3 class="text-danger fw-bold mb-3">Je, una uhakika?</h3>
                <p class="text-muted small mb-4">Unakaribia kufuta ombi la mkopo la mtumiaji <strong>{{ object.user.username }}</strong>. Kitendo hiki hakiwezi kurudishwa nyuma.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg px-4 fw-bold">Ndio, Futa Kabisa</button>
                    <a href="{% url 'admin_loan_list' %}" class="btn btn-light btn-lg px-4 ms-2">Ghairi</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
