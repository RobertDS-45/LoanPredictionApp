{% extends 'user/base.html' %}

{% block title %}Edit Loan Request - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm p-4 bg-white">
            <h4 class="fw-bold mb-4">Manage Loan Request</h4>

            {% load crispy_forms_tags %}
            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success fw-bold">Save changes</button>
                    <a href="{% url 'admin_loan_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
