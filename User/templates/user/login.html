{% extends 'user/base.html' %}

{% block title %}Login - LQS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="mb-3">
            <a href="{% url 'home' %}" class="text-decoration-none text-secondary small">← Back to Home</a>
        </div>

        <div class="card border-0 shadow-sm p-4 bg-white rounded-3">
            <div class="card-body">
                <h3 class="text-center fw-bold mb-4">Login to your account</h3>

                {% load crispy_forms_tags %}
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary fw-bold">Login</button>
                    </div>
                </form>

                <div class="text-center mt-3 small">
                    <span class="text-muted">Don't have an account?</span>
                    <a href="{% url 'register' %}" class="text-primary fw-semibold text-decoration-none ms-1">Sign up here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
