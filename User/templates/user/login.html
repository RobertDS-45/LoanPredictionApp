<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Ingia Kwenye Mfumo - LQS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            
            <div class="mb-3">
                <a href="{% url 'home' %}" class="text-decoration-none text-secondary small">← Rudi Nyumbani</a>
            </div>

            <div class="card border-0 shadow-sm p-4 bg-white rounded-3">
                <div class="card-body">
                    <h3 class="text-center fw-bold mb-4">Ingia Kwenye Akaunti</h3>

                    {% load crispy_forms_tags %}
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        {{ form|crispy }}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary fw-bold">Ingia (Login)</button>
                        </div>
                    </form>

                    <div class="text-center mt-3 small">
                        <span class="text-muted">Huna akaunti bado?</span>
                        <a href="{% url 'register' %}" class="text-decoration-none fw-semibold">Jisajili hapa</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
