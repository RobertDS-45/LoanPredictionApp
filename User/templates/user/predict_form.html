<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ombi la Utabiri wa Mkopo - LQS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="mb-3">
                <a href="{% url 'home' %}" class="text-decoration-none text-secondary small">← Rudi Nyumbani</a>
            </div>

            <div class="card form-card p-4 bg-white">
                <div class="card-body">
                    <h2 class="text-center fw-bold mb-2 text-dark">Taarifa za Mkopo</h2>
                    <p class="text-center text-muted small mb-4">Jaza fomu hii kwa umakini ili mfumo wetu wa Data Science utabiri uwezekano wa kupata mkopo.</p>

                    <form method="POST" action="{% url 'predict' %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="text_feature" class="form-label fw-semibold">Maelezo/Sababu ya Mkopo (Text Input)</label>
                            <textarea class="form-control" id="text_feature" name="text_feature" rows="3" placeholder="Eleza kwa ufupi jinsi utakavyotumia mkopo huu..." required></textarea>
                        </div>

                        <hr class="text-muted my-4">
                        <h5 class="fw-bold mb-3 text-secondary">Taarifa za Kifedha (Numeric Inputs)</h5>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="f1" class="form-label fw-semibold">Kipato cha Mwezi (f1)</label>
                                <div class="input-group">
                                    <span class="input-group-text">TZS</span>
                                    <input type="number" step="any" class="form-control" id="f1" name="f1" placeholder="Mf. 500000" required>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="f2" class="form-label fw-semibold">Kiasi cha Mkopo (f2)</label>
                                <div class="input-group">
                                    <span class="input-group-text">TZS</span>
                                    <input type="number" step="any" class="form-control" id="f2" name="f2" placeholder="Mf. 2000000" required>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="f3" class="form-label fw-semibold">Muda wa Marejesho (f3)</label>
                                <div class="input-group">
                                    <input type="number" step="any" class="form-control" id="f3" name="f3" placeholder="Mf. 12" required>
                                    <span class="input-group-text">Miezi</span>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="f4" class="form-label fw-semibold">Alama za Mikopo / Credit Score (f4)</label>
                                <input type="number" step="any" class="form-control" id="f4" name="f4" placeholder="Mf. 650" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold fs-6">Anza Utabiri Sasa</button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
