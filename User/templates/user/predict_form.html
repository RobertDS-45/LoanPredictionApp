{% extends 'user/base.html' %}

{% block title %}Loan Prediction Form - LQS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="mb-3">
            <a href="{% url 'home' %}" class="text-decoration-none text-secondary small">← Back to Home</a>
        </div>

        <div class="card form-card p-4 bg-white">
            <div class="card-body">
                <h2 class="text-center fw-bold mb-2 text-dark">Loan details</h2>
                <p class="text-center text-muted small mb-4">Complete this form carefully so our data science model can predict loan eligibility.</p>

                <form method="POST" action="{% url 'predict' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="text_feature" class="form-label fw-semibold">Loan purpose / description</label>
                        <textarea class="form-control" id="text_feature" name="text_feature" rows="3" placeholder="Briefly explain how you will use this loan..." required></textarea>
                    </div>

                    <hr class="text-muted my-4">
                    <h5 class="fw-bold mb-3 text-secondary">Financial information</h5>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="f1" class="form-label fw-semibold">Monthly income (f1)</label>
                            <div class="input-group">
                                <span class="input-group-text">TZS</span>
                                <input type="number" step="any" class="form-control" id="f1" name="f1" placeholder="e.g. 500000" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="f2" class="form-label fw-semibold">Loan amount (f2)</label>
                            <div class="input-group">
                                <span class="input-group-text">TZS</span>
                                <input type="number" step="any" class="form-control" id="f2" name="f2" placeholder="e.g. 2000000" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="f3" class="form-label fw-semibold">Repayment duration (f3)</label>
                            <div class="input-group">
                                <input type="number" step="any" class="form-control" id="f3" name="f3" placeholder="e.g. 12" required>
                                <span class="input-group-text">months</span>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="f4" class="form-label fw-semibold">Credit score (f4)</label>
                            <input type="number" step="any" class="form-control" id="f4" name="f4" placeholder="e.g. 650" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold fs-6">Start prediction</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
