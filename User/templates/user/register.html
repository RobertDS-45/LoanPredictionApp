<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usajili wa Akaunti - LQS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
        }
        .register-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="mb-3">
                <a href="{% url 'home' %}" class="text-decoration-none text-secondary small">← Rudi Nyumbani</a>
            </div>

            <div class="card register-card p-4 bg-white">
                <div class="card-body">
                    <h2 class="text-center fw-bold mb-2 text-dark">Ukurasa wa Usajili</h2>
                    <p class="text-center text-muted small mb-4">Tengeneza akaunti yako sasa ili uweze kutumia mfumo wa utabiri na kuhifadhi historia yako.</p>

                    {% load crispy_forms_tags %}

                    <form method="POST" action="{% url 'register' %}">
                        {% csrf_token %}
                        
                        {{ form|crispy }}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold fs-6">Jisajili (Sign Up)</button>
                        </div>
                    </form>

                    <hr class="text-muted my-4">
                    
                    <div class="text-center small">
                        <span class="text-muted">Tayari una akaunti?</span>
                        <a href="{% url 'login' %}" class="text-primary fw-semibold text-decoration-none ms-1">Ingia hapa</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
