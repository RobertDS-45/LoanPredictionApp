services:
  - type: web
    name: LoanPredictionApp
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: gunicorn LQS.wsgi --log-file -
    envVars:
      - key: DJANGO_ALLOWED_HOSTS
        value: loanpredictionapp-eaef.onrender.com
